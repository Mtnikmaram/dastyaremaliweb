<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستیار مالی</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--text:#17211f;--muted:#71807b;--line:#e3ebe8;--p:#0f766e;--p2:#115e59;--good:#15803d;--danger:#dc2626;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
aside{position:fixed;right:0;top:0;bottom:0;width:240px;background:#fff;border-left:1px solid var(--line);padding:25px 18px;z-index:5}.brand{display:flex;gap:10px;align-items:center;margin-bottom:32px}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:21px}.brand b{display:block}.brand small{color:var(--muted)}nav button{display:block;width:100%;border:0;background:none;text-align:right;padding:12px;border-radius:9px;color:var(--muted);margin:3px 0}nav button.active{background:#e8f5f2;color:var(--p);font-weight:bold}.main{margin-right:240px;padding:30px 36px;max-width:1220px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.top p{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 15px;font-weight:bold}.primary{background:var(--p);color:#fff;border-color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 8px 28px #123b2b0b}.grid{display:grid;gap:18px}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.finance{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff}.muted,.label{color:var(--muted);font-size:12px}.finance .label{color:#cce6e2}.balance{font-size:34px;font-weight:900;margin:9px 0 24px}.safe{font-size:27px;font-weight:900}.status{margin-top:20px;padding-top:14px;border-top:1px solid #ffffff33;display:flex;justify-content:space-between;font-size:12px}.metric strong{display:block;font-size:18px;margin-top:8px}.good{color:var(--good)}.danger{color:var(--danger)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters>*{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.tabs{display:flex;background:#eef2f1;padding:4px;border-radius:9px;margin-bottom:14px}.tabs button{border:0;background:none;padding:9px 16px;border-radius:7px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--p);font-weight:bold}.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}.icon{width:38px;height:38px;border-radius:10px;background:#eef5f3;display:grid;place-items:center}.amount{font-weight:900}.empty{text-align:center;color:var(--muted);padding:40px}.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:#fff;border-radius:16px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.error{background:#fef2f2;color:var(--danger);padding:10px;border-radius:9px;font-size:12px}.loading{text-align:center;color:var(--muted);padding:35px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.authlogo{margin:auto;width:52px;height:52px;border-radius:15px;background:#e8f5f2;color:var(--p);display:grid;place-items:center;font-size:25px}.authbox h1{text-align:center}.authbox p{text-align:center;color:var(--muted);font-size:13px}.mobile{display:none}
@media(max-width:800px){aside{display:none}.main{margin:0;padding:20px 14px 85px}.two,.three{grid-template-columns:1fr}.top h1{font-size:21px}.balance{font-size:29px}.mobile{display:flex;position:fixed;right:0;left:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:10}.mobile button{flex:1;border:0;background:none;color:var(--muted);font-size:11px}.mobile button.active{color:var(--p);font-weight:bold}.formgrid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script>
var API='https://n8n.etedak.ir/dastyar-api',A='fa.auth.access',R='fa.auth.refresh',state={tx:[],cats:[],accs:[],tab:'all'};
var faDigits='۰۱۲۳۴۵۶۷۸۹';
function fa(v){return String(v).replace(/\d/g,function(x){return faDigits[+x]})}
function money(v){var n=Number(String(v==null?0:v).replace(/[^\d.-]/g,''))||0;return fa(Math.round(n).toLocaleString('en-US').replace(/,/g,'٬'))}
function tok(){return localStorage.getItem(A)}
function tokens(x){if(!x){localStorage.removeItem(A);localStorage.removeItem(R)}else{localStorage.setItem(A,x.access);if(x.refresh)localStorage.setItem(R,x.refresh)}}
async function refresh(){var r=localStorage.getItem(R);if(!r)return false;try{var x=await fetch(API+'/api/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:r})});if(!x.ok)throw 0;tokens(await x.json());return true}catch(e){tokens(null);return false}}
async function api(path,opt){opt=opt||{};var h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(tok())h.Authorization='Bearer '+tok();var r=await fetch(API+path,Object.assign({},opt,{headers:h}));if(r.status===401&&await refresh()){h.Authorization='Bearer '+tok();r=await fetch(API+path,Object.assign({},opt,{headers:h}))}if(r.status===401){tokens(null);go('auth');throw Error('جلسه منقضی شده است.')}var t=await r.text(),d=null;try{d=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw Error((d&&d.detail)||'خطا در ارتباط با سرور');return d}
function list(x){return Array.isArray(x)?x:(x&&Array.isArray(x.results)?x.results:[])}
function go(p){location.hash='#'+p}
function shell(active,content){return '<aside><div class="brand"><div class="logo">₮</div><div><b>دستیار مالی</b><small>همراه آرام پول شما</small></div></div><nav><button class="'+(active==='home'?'active':'')+'" onclick="go(\'home\')">⌂ خانه</button><button class="'+(active==='tx'?'active':'')+'" onclick="go(\'tx\')">▣ تراکنش‌ها</button><button onclick="soon()">◈ تعهدات</button><button onclick="soon()">◌ گزارش‌ها</button><button onclick="soon()">✦ دستیار</button></nav><div style="margin-top:auto"><button class="btn" style="width:100%" onclick="logout()">خروج</button></div></aside><div class="mobile"><button class="'+(active==='home'?'active':'')+'" onclick="go(\'home\')">⌂<br>خانه</button><button class="'+(active==='tx'?'active':'')+'" onclick="go(\'tx\')">▣<br>تراکنش‌ها</button><button onclick="soon()">◈<br>تعهدات</button><button onclick="logout()">↪<br>خروج</button></div><main class="main">'+content+'</main>'}
function soon(){alert('این بخش در مرحله بعدی فعال می‌شود.')}
function logout(){tokens(null);go('auth')}
function auth(){document.body.innerHTML='<main class="auth"><section class="authbox"><div class="authlogo">₮</div><h1>ورود به دستیار مالی</h1><p>ورود با حساب واقعی Django</p><div id="e"></div><form id="f"><div class="field"><label>نام کاربری</label><input id="u" required></div><div class="field"><label>گذرواژه</label><input id="p" type="password" required></div><button class="btn primary" style="width:100%">ورود</button></form></section></main>';document.getElementById('f').onsubmit=async function(e){e.preventDefault();try{var x=await api('/api/auth/token/',{method:'POST',body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});tokens(x);go('home')}catch(x){document.getElementById('e').innerHTML='<div class="error">'+x.message+'</div>'}}}
async function home(){document.body.innerHTML=shell('home','<div class="top"><div><h1>سلام 👋</h1><p>نمای واقعی وضعیت مالی شما</p></div><button class="btn primary" onclick="openForm()">＋ ثبت تراکنش</button></div><div id="b" class="loading">در حال دریافت اطلاعات واقعی...</div>');try{var d=await api('/api/dashboard/');document.getElementById('b').innerHTML='<div class="grid two"><section class="card finance"><span class="label">موجودی کل</span><div class="balance">'+money(d.current_balance)+' تومان</div><span class="label">قابل خرج کردن</span><div class="safe">'+money(d.safe_to_spend)+' تومان</div><div class="status"><span>● '+(d.health_label||'—')+'</span><span>'+fa(d.days_remaining||0)+' روز تا پایان ماه</span></div></section><section class="card"><h2>وضعیت این ماه</h2><div class="grid three"><div class="metric"><span class="label">درآمد</span><strong class="good">'+money(d.monthly_income)+'</strong></div><div class="metric"><span class="label">هزینه</span><strong class="danger">'+money(d.monthly_expense)+'</strong></div><div class="metric"><span class="label">جریان خالص</span><strong>'+money(d.net_monthly_cashflow)+'</strong></div></div></section></div><div class="grid two" style="margin-top:18px"><section class="card"><h2>تعهدات</h2><div class="row"><span>معوق</span><b class="danger">'+money(d.overdue_commitments)+' تومان</b></div><div class="row"><span>این ماه</span><b>'+money(d.current_month_commitments)+' تومان</b></div><div class="row"><span>ماه بعد</span><b>'+money(d.next_month_commitments)+' تومان</b></div><div class="row"><span>آینده</span><b>'+money(d.future_commitments)+' تومان</b></div></section><section class="card"><h2>برآورد پایان ماه</h2><div class="row"><span>بودجه روزانه امن</span><b>'+money(d.daily_safe_budget)+' تومان</b></div><div class="row"><span>موجودی پیش‌بینی‌شده</span><b>'+money(d.projected_month_end_balance)+' تومان</b></div></section></div>'}catch(e){document.getElementById('b').innerHTML='<div class="card error">'+e.message+'</div>'}}
async function tx(){document.body.innerHTML=shell('tx','<div class="top"><div><h1>تراکنش‌ها</h1><p>داده‌های واقعی حساب شما</p></div><button class="btn primary" onclick="openForm()">＋ ثبت تراکنش</button></div><section class="card"><div class="tabs"><button class="active" id="all">همه</button><button id="inc">دریافت‌ها</button><button id="exp">پرداخت‌ها</button></div><div class="filters"><input id="q" placeholder="جستجو..."><select id="c"><option value="">همه دسته‌ها</option></select><select id="a"><option value="">همه حساب‌ها</option></select><button class="btn" onclick="loadTx()">بروزرسانی</button></div></section><div id="list" class="loading">در حال دریافت...</div>');['all','inc','exp'].forEach(function(id){document.getElementById(id).onclick=function(){state.tab=id;['all','inc','exp'].forEach(function(x){document.getElementById(x).classList.remove('active')});this.classList.add('active');draw()}});document.getElementById('q').oninput=draw;document.getElementById('c').onchange=draw;document.getElementById('a').onchange=draw;await loadTx()}
async function loadTx(){try{var z=await Promise.all([api('/api/transactions/'),api('/api/categories/'),api('/api/accounts/')]);state.tx=list(z[0]);state.cats=list(z[1]);state.accs=list(z[2]);document.getElementById('c').innerHTML='<option value="">همه دسته‌ها</option>'+state.cats.map(function(x){return '<option value="'+x.id+'">'+(x.name||x.title||x.id)+'</option>'}).join('');document.getElementById('a').innerHTML='<option value="">همه حساب‌ها</option>'+state.accs.map(function(x){return '<option value="'+x.id+'">'+(x.name||x.title||x.id)+'</option>'}).join('');draw()}catch(e){document.getElementById('list').innerHTML='<div class="card error">'+e.message+'</div>'}}
function income(t){return String(t.transaction_type||t.type||'').toLowerCase().indexOf('income')>=0||String(t.transaction_type||t.type||'').indexOf('درآمد')>=0}
function cname(t){var id=t.category_id||t.category;if(id&&typeof id==='object')return id.name||id.title||'';var x=state.cats.find(function(a){return String(a.id)===String(id)});return x?(x.name||x.title):''}
function aname(t){var id=t.account_id||t.account;if(id&&typeof id==='object')return id.name||id.title||'';var x=state.accs.find(function(a){return String(a.id)===String(id)});return x?(x.name||x.title):''}
function draw(){var q=(document.getElementById('q')||{}).value||'',c=(document.getElementById('c')||{}).value||'',a=(document.getElementById('a')||{}).value||'';var arr=state.tx.filter(function(t){return (state.tab==='all'||(state.tab==='inc'?income(t):!income(t)))&&(!c||String(t.category_id||t.category)===c)&&(!a||String(t.account_id||t.account)===a)&&(!q||JSON.stringify(t).toLowerCase().indexOf(q.toLowerCase())>=0)});var inc=arr.filter(income).reduce(function(s,t){return s+Number(t.amount||0)},0),exp=arr.filter(function(t){return !income(t)}).reduce(function(s,t){return s+Number(t.amount||0)},0);document.getElementById('list').innerHTML='<section class="card"><div class="grid three"><div><span class="label">درآمد</span><div class="metric"><strong class="good">'+money(inc)+' تومان</strong></div></div><div><span class="label">هزینه</span><div class="metric"><strong class="danger">'+money(exp)+' تومان</strong></div></div><div><span class="label">خالص</span><div class="metric"><strong>'+money(inc-exp)+' تومان</strong></div></div></div></section><section class="card" style="margin-top:18px">'+(arr.length?arr.map(function(t){return '<div class="tx"><div class="icon">'+(income(t)?'↙':'↗')+'</div><div><b>'+(t.title||t.description||t.note||'تراکنش')+'</b><div class="muted">'+(cname(t)||'بدون دسته')+' · '+(aname(t)||'بدون حساب')+' · '+(t.date||t.created_at||'')+'</div></div><div><div class="amount '+(income(t)?'good':'danger')+'">'+(income(t)?'+':'−')+money(t.amount)+'</div><button class="btn" onclick="edit('+t.id+')">ویرایش</button> <button class="btn" onclick="del('+t.id+')">حذف</button></div></div>'}).join(''):'<div class="empty">تراکنشی پیدا نشد.</div>')+'</section>'}
function openForm(id){var t=id?state.tx.find(function(x){return x.id===id}):null;var cs=state.cats,as=state.accs;document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="m"><section class="modal"><div class="top"><h2>'+ (t?'ویرایش تراکنش':'ثبت تراکنش')+'</h2><button class="btn" onclick="closeM()">×</button></div><form id="tf"><div class="field"><label>نوع</label><select id="type"><option value="expense">پرداخت</option><option value="income">دریافت</option></select></div><div class="formgrid"><div class="field"><label>مبلغ</label><input id="amt" required value="'+(t?t.amount:'')+'"></div><div class="field"><label>تاریخ</label><input id="date" type="date" value="'+((t&&(t.date||'')).slice(0,10))+'"></div></div><div class="field"><label>عنوان</label><input id="title" required value="'+(t?(t.title||t.description||'').replace(/"/g,'&quot;'):'')+'"></div><div class="formgrid"><div class="field"><label>دسته‌بندی</label><select id="cat"><option value="">بدون دسته</option>'+cs.map(function(x){return '<option value="'+x.id+'">'+(x.name||x.title||x.id)+'</option>'}).join('')+'</select></div><div class="field"><label>حساب</label><select id="acc"><option value="">بدون حساب</option>'+as.map(function(x){return '<option value="'+x.id+'">'+(x.name||x.title||x.id)+'</option>'}).join('')+'</select></div></div><div class="field"><label>توضیحات</label><textarea id="note" rows="3">'+(t?(t.notes||t.note||''):'')+'</textarea></div><div id="fe"></div><button class="btn primary" style="width:100%">ذخیره</button></form></section></div>');document.getElementById('type').value=income(t||{})?'income':'expense';if(t){document.getElementById('cat').value=t.category_id||t.category||'';document.getElementById('acc').value=t.account_id||t.account||''}document.getElementById('tf').onsubmit=async function(e){e.preventDefault();var amount=Number(document.getElementById('amt').value.replace(/[^\d.-]/g,''));if(amount<=0){document.getElementById('fe').innerHTML='<div class="error">مبلغ معتبر وارد کنید.</div>';return}var body={amount:amount,transaction_type:document.getElementById('type').value,title:document.getElementById('title').value.trim(),description:document.getElementById('note').value.trim(),notes:document.getElementById('note').value.trim(),date:document.getElementById('date').value};if(document.getElementById('cat').value)body.category=Number(document.getElementById('cat').value);if(document.getElementById('acc').value)body.account=Number(document.getElementById('acc').value);try{await api(t?'/api/transactions/'+t.id+'/':'/api/transactions/',{method:t?'PATCH':'POST',body:JSON.stringify(body)});closeM();await loadTx();alert(t?'تراکنش ویرایش شد':'تراکنش ثبت شد')}catch(x){document.getElementById('fe').innerHTML='<div class="error">'+x.message+'</div>'}}}
function closeM(){var m=document.getElementById('m');if(m)m.remove()}
function edit(id){openForm(id)}
async function del(id){if(!confirm('تراکنش حذف شود؟'))return;try{await api('/api/transactions/'+id+'/',{method:'DELETE'});await loadTx()}catch(e){alert(e.message)}}
function route(){var p=location.hash.slice(1)||'home';if(!tok()&&p!=='auth')return auth();if(p==='auth')return auth();if(p==='tx')return tx();return home()}
window.addEventListener('hashchange',route);window.openForm=openForm;window.edit=edit;window.del=del;window.closeM=closeM;window.loadTx=loadTx;window.go=go;window.logout=logout;route();
</script></body></html>
