<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار مالی</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f8f7;--card:#fff;--text:#17211f;--muted:#71807b;--line:#e1e9e6;--p:#0f766e;--p2:#115e59;--good:#15803d;--danger:#dc2626;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
aside{position:fixed;right:0;top:0;bottom:0;width:235px;background:#fff;border-left:1px solid var(--line);padding:24px 16px;z-index:5}.brand{display:flex;gap:10px;align-items:center;margin-bottom:30px}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:21px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:right;padding:12px;border-radius:11px;color:var(--muted);margin:3px 0;font-size:13px}nav button:first-letter{font-size:18px}nav button.active{background:#e8f5f2;color:var(--p);font-weight:bold}.main{margin-right:235px;padding:28px 34px;max-width:1280px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.tx-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:8px}.income-action{background:var(--p);color:#fff;border-color:var(--p)}.expense-action{background:#fff;color:var(--danger);border-color:#e8b5b5}.transfer-action{background:#fff;color:var(--p);border-color:#9fd4cc}.unit{color:var(--muted);font-size:11px;font-weight:normal}.top h1{margin:0;font-size:24px}.top p{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:bold;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:var(--p);color:#fff;border-color:var(--p)}.dangerbtn{color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 7px 25px #123b2b0a}.grid{display:grid;gap:16px}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.finance{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff}.finance .label{color:#cce6e2}.label,.muted{color:var(--muted);font-size:11px}.balance{font-size:32px;font-weight:900;margin:8px 0 20px}.safe{font-size:25px;font-weight:900}.status{margin-top:18px;padding-top:13px;border-top:1px solid #ffffff33;display:flex;justify-content:space-between;font-size:11px}.metric strong{display:block;font-size:17px;margin-top:7px}.good{color:var(--good)}.danger{color:var(--danger)}.warn{color:var(--warn)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters>*{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px}.tabs{display:flex;background:#eef2f1;padding:4px;border-radius:9px;margin-bottom:13px}.tabs button{border:0;background:none;padding:8px 15px;border-radius:7px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--p);font-weight:bold}.tx{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900}.icon.income{background:#ecfdf3;color:var(--good)}.icon.expense{background:#fef2f2;color:var(--danger)}.amount{font-weight:900}.empty{text-align:center;color:var(--muted);padding:38px}.loading{text-align:center;color:var(--muted);padding:35px}.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:#fff;border-radius:16px;padding:21px;width:min(560px,100%);max-height:93vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field input[readonly]{background:#f1f5f3;color:var(--p2);font-weight:900;cursor:not-allowed}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.error{background:#fef2f2;color:var(--danger);padding:10px;border-radius:9px;font-size:12px}.notice{background:#fff7ed;color:var(--warn);padding:10px;border-radius:9px;font-size:12px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.authlogo{margin:auto;width:52px;height:52px;border-radius:15px;background:#e8f5f2;color:var(--p);display:grid;place-items:center;font-size:25px}.authbox h1{text-align:center}.authbox p{text-align:center;color:var(--muted);font-size:12px}.mobile{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef5f3;color:var(--p);font-size:10px}.pill.warn{background:#fff7ed}.pill.danger{background:#fef2f2}.mini{font-size:10px;color:var(--muted)}h2{font-size:17px;margin:0 0 14px}
@media(max-width:800px){aside{display:none}.main{margin:0;padding:18px 13px 78px}.two,.three,.four{grid-template-columns:1fr}.top h1{font-size:20px}.balance{font-size:28px}.mobile{display:flex;position:fixed;right:0;left:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:10}.mobile button{flex:1;border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.mobile button span{font-size:10px}.mobile button.active{background:#f2f8f6}.mobile button.active{color:var(--p);font-weight:bold}.formgrid{grid-template-columns:1fr}.tx{grid-template-columns:auto 1fr}.tx>div:last-child{grid-column:2}.tx .btn{padding:5px 8px;font-size:10px}}
.jalali-picker{width:min(360px,100%)}.jp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.jp-head button{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px}.jp-title{text-align:center;font-weight:bold;flex:1}.jp-week,.jp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.jp-week div{text-align:center;color:var(--muted);font-size:10px;padding:5px}.jp-days button{border:0;background:#f7faf9;border-radius:9px;padding:9px 0;font-size:12px}.jp-days button:hover{background:#e8f5f2;color:var(--p)}.jp-days button.selected{background:var(--p);color:#fff}.jp-days button.empty{visibility:hidden;pointer-events:none}.date-field{position:relative}.date-field:after{content:'📅';position:absolute;left:10px;bottom:10px;font-size:15px;pointer-events:none}.date-field input{padding-left:38px!important}</style>
</head>
<body><div id="app"></div>
<script>
const API='https://n8n.etedak.ir/dastyar-api',AT='fa.auth.access',RT='fa.auth.refresh';
const S={tx:[],cats:[],accs:[],loans:[],inst:[],page:'home',filter:'all'};
const fd='۰۱۲۳۴۵۶۷۸۹';
const fa=v=>String(v??'').replace(/\d/g,x=>fd[+x]);
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const normalizeDigits=v=>String(v??'').replace(/[۰-۹]/g,d=>String(fd.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[٬,،]/g,'');
const num=v=>Number(normalizeDigits(v).replace(/[^\d.-]/g,''))||0;
const persianDateFmt=new Intl.DateTimeFormat('en-US-u-ca-persian',{calendar:'persian',year:'numeric',month:'2-digit',day:'2-digit',timeZone:'UTC'});
const gregToJalali=iso=>{if(!iso)return '';const a=iso.split('-').map(Number);const p=Object.fromEntries(persianDateFmt.formatToParts(new Date(Date.UTC(a[0],a[1]-1,a[2],12))).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return p.year+'/'+p.month+'/'+p.day};
const jalaliToGreg=raw=>{const a=normalizeDigits(raw).replace(/-/g,'/').trim().split('/').map(Number);if(a.length!==3||a.some(x=>!Number.isFinite(x)))throw Error('تاریخ شمسی را به شکل ۱۴۰۵/۰۷/۰۱ وارد کنید.');const jy=a[0],jm=a[1],jd=a[2],gy=jy+621;let base=null;for(let i=-2;i<=3;i++){const d=new Date(Date.UTC(gy,2,19+i,12));const p=Object.fromEntries(persianDateFmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));if(p.year===jy&&p.month===1&&p.day===1){base=d;break}}if(!base||jm<1||jm>12||jd<1||jd>(jm<=6?31:jm<=11?30:31))throw Error('تاریخ شمسی نامعتبر است.');const offset=(jm<=6?(jm-1)*31:jm<=11?186+(jm-7)*30:336)+(jd-1);const d=new Date(base.getTime()+offset*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const setJalaliField=(id,greg)=>{const el=document.getElementById(id);if(el)el.value=gregToJalali(greg||todayLocal())};
const formatAmountInput=el=>{const digits=normalizeDigits(el.value).replace(/\D/g,'');el.value=digits?fa(Number(digits).toLocaleString('en-US')):''};
const money=v=>fa(Math.round(num(v)).toLocaleString('en-US').replace(/,/g,'٬'));
const list=x=>Array.isArray(x)?x:(x&&Array.isArray(x.results)?x.results:[]);
const token=()=>localStorage.getItem(AT);
function saveTokens(x){if(!x){localStorage.removeItem(AT);localStorage.removeItem(RT)}else{localStorage.setItem(AT,x.access);if(x.refresh)localStorage.setItem(RT,x.refresh)}}
async function refresh(){const r=localStorage.getItem(RT);if(!r)return false;try{const x=await fetch(API+'/api/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:r})});if(!x.ok)throw Error();saveTokens(await x.json());return true}catch(e){saveTokens(null);return false}}
async function api(path,opt={}){let h=Object.assign({'Content-Type':'application/json'},opt.headers||{});const isAuth=path.startsWith('/api/auth/');if(token()&&!isAuth)h.Authorization='Bearer '+token();let r=await fetch(API+path,{...opt,headers:h});if(r.status===401&&!isAuth&&await refresh()){h.Authorization='Bearer '+token();r=await fetch(API+path,{...opt,headers:h})}if(r.status===401){if(!isAuth){saveTokens(null);location.hash='#auth';throw Error('جلسه منقضی شده است.')} }const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}if(!r.ok){let m=d?.detail;if(d&&typeof d==='object'&&!m)m=Object.values(d).flat().join(' ');throw Error(m||'خطا در ارتباط با سرور')}return d}
const go=p=>location.hash='#'+p;
function shell(active,content){return `<aside><div class="brand"><div class="logo">₮</div><div><b>دستیار مالی</b><small>همراه آرام پول شما</small></div></div><nav>
<button class="${active==='home'?'active':''}" onclick="go('home')">⌂ <span>خانه</span></button>
<button class="${active==='tx'?'active':''}" onclick="go('tx')">▤ <span>تراکنش‌ها</span></button>
<button class="${active==='loans'?'active':''}" onclick="go('loans')">◫ <span>وام و اقساط</span></button>
<button class="${active==='accounts'?'active':''}" onclick="go('accounts')">▣ <span>حساب‌ها</span></button>
<button class="${active==='categories'?'active':''}" onclick="go('categories')">◌ دسته‌بندی‌ها</button>
<button class="${active==='assistant'?'active':''}" onclick="go('assistant')">✦ دستیار</button>
</nav><div style="position:absolute;bottom:22px;left:16px;right:16px"><button class="btn" style="width:100%" onclick="logout()">خروج</button></div></aside>
<div class="mobile"><button class="${active==='home'?'active':''}" onclick="go('home')">⌂<span>خانه</span></button><button class="${active==='tx'?'active':''}" onclick="go('tx')">⇄<span>تراکنش</span></button><button class="${active==='loans'?'active':''}" onclick="go('loans')">◷<span>اقساط</span></button><button class="${active==='accounts'?'active':''}" onclick="go('accounts')">▣<span>حساب</span></button><button onclick="logout()">⇥<span>خروج</span></button></div>
<main class="main">${content}</main>`}
function logout(){saveTokens(null);go('auth')}
function auth(){document.body.innerHTML=`<main class="auth"><section class="authbox"><div class="authlogo">₮</div><h1>دستیار مالی</h1><p id="authsub">ورود به حساب</p><div id="e"></div><div class="tabs"><button id="loginTab" class="active" type="button">ورود</button><button id="registerTab" type="button">ساخت حساب</button></div><form id="af"><div class="field"><label>نام کاربری</label><input id="u" required autocomplete="username"></div><div class="field" id="nameField" style="display:none"><label>نام</label><input id="fn" autocomplete="given-name"></div><div class="field"><label>گذرواژه</label><input id="p" type="password" required minlength="6" autocomplete="current-password"></div><div class="field" id="p2Field" style="display:none"><label>تکرار گذرواژه</label><input id="p2" type="password" minlength="6" autocomplete="new-password"></div><button class="btn primary" id="authBtn" style="width:100%">ورود</button></form></section></main>`;let mode='login';const setMode=m=>{mode=m;loginTab.classList.toggle('active',m==='login');registerTab.classList.toggle('active',m==='register');nameField.style.display=m==='register'?'block':'none';p2Field.style.display=m==='register'?'block':'none';fn.required=m==='register';p2.required=m==='register';authsub.textContent=m==='register'?'ساخت حساب جدید':'ورود به حساب';authBtn.textContent=m==='register'?'ساخت حساب':'ورود';e.innerHTML=''};loginTab.onclick=()=>setMode('login');registerTab.onclick=()=>setMode('register');af.onsubmit=async ev=>{ev.preventDefault();try{if(mode==='register'){if(p.value!==p2.value)throw Error('گذرواژه و تکرار آن یکسان نیستند.');await api('/api/auth/register/',{method:'POST',body:JSON.stringify({username:u.value.trim(),password:p.value,first_name:fn.value.trim()})});saveTokens(await api('/api/auth/token/',{method:'POST',body:JSON.stringify({username:u.value.trim(),password:p.value})}));await route()}else{saveTokens(null);saveTokens(await api('/api/auth/token/',{method:'POST',body:JSON.stringify({username:u.value.trim(),password:p.value})}));go('home')}}catch(x){document.getElementById('e').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}
function risk(r){return r==='SAFE'?'<span class="pill">وضعیت خوب</span>':r==='WARNING'?'<span class="pill warn">نیازمند توجه</span>':'<span class="pill danger">وضعیت بحرانی</span>'}
async function home(){document.body.innerHTML=shell('home',`<div class="top"><div><h1>داشبورد مالی</h1><p>همه اعداد از موتور مالی Django می‌آیند.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="openTx(null,'INCOME')">＋ ثبت درآمد</button><button class="btn primary" onclick="openTx(null,'EXPENSE')">− ثبت هزینه</button></div></div><div id="dash" class="loading">در حال دریافت اطلاعات واقعی...</div>`);try{const d=await api('/api/dashboard/');document.getElementById('dash').innerHTML=`
<div class="grid two"><section class="card finance"><span class="label">موجودی فعلی</span><div class="balance">${money(d.current_balance)} تومان</div><span class="label">قابل خرج کردن امن</span><div class="safe">${money(d.safe_to_spend)} تومان</div><div class="status"><span>${risk(d.risk_level)}</span><span>${fa(d.days_remaining)} روز باقی‌مانده</span></div></section>
<section class="card"><h2>این ماه</h2><div class="grid three"><div class="metric"><span class="label">درآمد</span><strong class="good">${money(d.monthly_income)}</strong></div><div class="metric"><span class="label">هزینه</span><strong class="danger">${money(d.monthly_expense)}</strong></div><div class="metric"><span class="label">خالص</span><strong>${money(d.net_monthly_cashflow)}</strong></div></div><div class="row" style="margin-top:18px"><span>کل بدهی</span><b>${money(d.total_debt)} تومان</b></div></section></div>
<div class="grid two" style="margin-top:16px"><section class="card"><h2>تعهدات</h2><div class="row"><span>معوق</span><b class="danger">${money(d.overdue_commitments)} تومان</b></div><div class="row"><span>این ماه</span><b>${money(d.current_month_commitments)} تومان</b></div><div class="row"><span>ماه بعد</span><b>${money(d.next_month_commitments)} تومان</b></div><div class="row"><span>آینده</span><b>${money(d.future_commitments)} تومان</b></div></section>
<section class="card"><h2>پیش‌بینی</h2><div class="row"><span>بودجه امن روزانه</span><b>${money(d.daily_safe_budget)} تومان</b></div><div class="row"><span>خرج برآوردی باقی‌مانده</span><b>${money(d.projected_remaining_spend)} تومان</b></div><div class="row"><span>موجودی پایان ماه</span><b>${money(d.projected_month_end_balance)} تومان</b></div></section></div>`}catch(e){document.getElementById('dash').innerHTML='<div class="card error">'+e.message+'</div>'}}
function typeIs(t,x){return (t.transaction_type||'')===x}
function cname(t){const id=t.category;return stateFind(S.cats,id)}
function accountName(t){return stateFind(S.accs,t.account)}
function stateFind(arr,id){if(id&&typeof id==='object')return id.name||id.title||'';const x=arr.find(a=>String(a.id)===String(id));return x?x.name:''}
async function ensureData(){const z=await Promise.all([api('/api/transactions/'),api('/api/categories/'),api('/api/accounts/')]);S.tx=list(z[0]);S.cats=list(z[1]);S.accs=list(z[2]);return S}
async function txPage(){document.body.innerHTML=shell('tx',`<div class="top"><div><h1>تراکنش‌ها</h1><p>ثبت، ویرایش و حذف روی داده واقعی.</p></div><div class="tx-actions"><button class="btn income-action" onclick="openTx(null,'INCOME')">＋ ثبت درآمد</button><button class="btn expense-action" onclick="openTx(null,'EXPENSE')">− ثبت هزینه</button><button class="btn transfer-action" onclick="openTransfer()">⇄ انتقال</button></div></div><section class="card"><div class="tabs"><button class="active" id="tall">همه</button><button id="tinc">دریافت‌ها</button><button id="texp">پرداخت‌ها</button></div><div class="filters"><input id="q" placeholder="جستجو..."><select id="tc"><option value="">همه دسته‌ها</option></select><select id="ta"><option value="">همه حساب‌ها</option></select><button class="btn" onclick="loadTx()">بروزرسانی</button></div></section><div id="txout" class="loading">در حال دریافت...</div>`);await loadTx();['tall','tinc','texp'].forEach((id,i)=>document.getElementById(id).onclick=()=>{S.filter=['all','inc','exp'][i];['tall','tinc','texp'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(id).classList.add('active');drawTx()});q.oninput=drawTx;tc.onchange=drawTx;ta.onchange=drawTx}
async function loadTx(){try{await ensureData();tc.innerHTML='<option value="">همه دسته‌ها</option>'+S.cats.map(x=>'<option value="'+x.id+'">'+x.name+(x.is_active?'':' (غیرفعال)')+'</option>').join('');ta.innerHTML='<option value="">همه حساب‌ها</option>'+S.accs.map(x=>'<option value="'+x.id+'">'+x.name+(x.is_active?'':' (غیرفعال)')+'</option>').join('');drawTx()}catch(e){txout.innerHTML='<div class="card error">'+e.message+'</div>'}}
function drawTx(){const query=(document.getElementById('q')?.value||'').toLowerCase(),cat=document.getElementById('tc')?.value||'',acc=document.getElementById('ta')?.value||'';let arr=S.tx.filter(t=>(S.filter==='all'||(S.filter==='inc'?typeIs(t,'INCOME'):typeIs(t,'EXPENSE')))&&(!cat||String(t.category)===cat)&&(!acc||String(t.account)===acc)&&(!query||JSON.stringify(t).toLowerCase().includes(query)));const inc=arr.filter(t=>typeIs(t,'INCOME')).reduce((s,t)=>s+num(t.amount),0),exp=arr.filter(t=>typeIs(t,'EXPENSE')).reduce((s,t)=>s+num(t.amount),0);txout.innerHTML='<section class="card"><div class="grid three"><div><span class="label">دریافت</span><div class="metric"><strong class="good">'+money(inc)+' تومان</strong></div></div><div><span class="label">پرداخت</span><div class="metric"><strong class="danger">'+money(exp)+' تومان</strong></div></div><div><span class="label">خالص فیلتر</span><div class="metric"><strong>'+money(inc-exp)+' تومان</strong></div></div></div></section><section class="card" style="margin-top:16px">'+(arr.length?arr.map(t=>'<div class="tx"><div class="icon '+(typeIs(t,'INCOME')?'income':(t.transaction_type==='TRANSFER'?'income':'expense'))+'">'+(typeIs(t,'INCOME')?'↙':(t.transaction_type==='TRANSFER'?'⇄':'↗'))+'</div><div><b>'+esc(t.description||'تراکنش')+'</b><div class="muted">'+(t.transaction_type==='TRANSFER'?'انتقال بین حساب‌ها':esc(cname(t)||'بدون دسته'))+' · '+esc(accountName(t)||'')+' · '+fa(gregToJalali(t.date||''))+'</div></div><div><div class="amount '+(typeIs(t,'INCOME')?'good':(t.transaction_type==='TRANSFER'?'':'danger'))+'">'+(typeIs(t,'INCOME')?'+':(t.transaction_type==='TRANSFER'?'⇄':'−'))+money(t.amount)+' تومان</div>'+(t.transaction_type==='TRANSFER'?'<span class="mini">انتقال</span>':'<button class="btn" onclick="openTx('+t.id+')">ویرایش</button> <button class="btn dangerbtn" onclick="deleteTx('+t.id+')">حذف</button>')+'</div></div>').join(''):'<div class="empty">تراکنشی پیدا نشد.</div>')+'</section>'}

function openTx(id,presetType){const t=id?S.tx.find(x=>x.id===id):null;if(!S.cats.length||!S.accs.length){Promise.all([api('/api/categories/'),api('/api/accounts/')]).then(z=>{S.cats=list(z[0]);S.accs=list(z[1]);openTx(id,presetType)});return}document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>${t?'ویرایش تراکنش':'ثبت تراکنش'}</h2><button class="btn" onclick="closeModal()">×</button></div><form id="txform"><div class="field" id="typewrap"><label>نوع</label><select id="ftype"><option value="EXPENSE">هزینه</option><option value="INCOME">درآمد</option></select></div><div class="formgrid"><div class="field"><label>مبلغ <span class="unit">تومان</span></label><input id="famount" inputmode="numeric" required value="${t?money(t.amount):''}"></div><div class="field date-field"><label>تاریخ شمسی</label><input id="fdate" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۰۱" required></div></div><div class="field"><label>شرح <span class="mini">(اختیاری)</span></label><input id="fdesc" value="${esc(t?t.description:'')}"></div><div class="formgrid"><div class="field"><label>دسته‌بندی</label><select id="fcat"><option value="">انتخاب کنید</option>${S.cats.filter(x=>x.is_active&&x.category_type===(t?.transaction_type||presetType||'EXPENSE')).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}</select></div><div class="field"><label>حساب</label><select id="facc"><option value="">انتخاب کنید</option>${S.accs.filter(x=>x.is_active).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}</select></div></div><div id="formerr"></div><button class="btn primary" style="width:100%">ذخیره</button></form></section></div>`);ftype.value=t?.transaction_type||presetType||'EXPENSE';if(presetType&&!t)typewrap.style.display='none';if(t){fcat.value=t.category||'';facc.value=t.account||''}setJalaliField('fdate',t?.date||todayLocal());famount.addEventListener('input',()=>formatAmountInput(famount));txform.onsubmit=async e=>{e.preventDefault();const type=presetType||ftype.value,body={account:Number(facc.value),category:fcat.value?Number(fcat.value):null,transaction_type:type,amount:num(famount.value),date:jalaliToGreg(fdate.value),description:fdesc.value.trim(),reference:'',is_confirmed:true};try{if(!body.account||body.amount<=0)throw Error('حساب و مبلغ الزامی هستند.');if(!body.category)throw Error('دسته‌بندی الزامی است.');const r=await api(t?'/api/transactions/'+t.id+'/':'/api/transactions/',{method:t?'PATCH':'POST',body:JSON.stringify(body)});closeModal();await ensureData();await txPage();if(r?.impact)alert('تراکنش ثبت شد. بودجه امن روزانه: '+money(r.impact.daily_safe_budget_after)+' تومان')}catch(x){formerr.innerHTML='<div class="error">'+x.message+'</div>'}}}

function openTransfer(){if(!S.accs.length){api('/api/accounts/').then(x=>{S.accs=list(x);openTransfer()});return}const opts=S.accs.filter(x=>x.is_active).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>انتقال بین حساب‌ها</h2><button class="btn" onclick="closeModal()">×</button></div><form id="transferform"><div class="formgrid"><div class="field"><label>حساب مبدا</label><select id="tsource">'+opts+'</select></div><div class="field"><label>حساب مقصد</label><select id="tdest">'+opts+'</select></div></div><div class="field"><label>مبلغ <span class="unit">تومان</span></label><input id="tamount" inputmode="numeric" required></div><div class="field date-field"><label>تاریخ شمسی</label><input id="tdate" inputmode="numeric" required placeholder="۱۴۰۵/۰۷/۰۱"></div><div class="field"><label>شرح</label><input id="tdesc" value="انتقال بین حساب‌ها"></div><div id="transfererr"></div><button class="btn primary" style="width:100%">ثبت انتقال</button></form></section></div>');setJalaliField('tdate',todayLocal());tamount.addEventListener('input',()=>formatAmountInput(tamount));transferform.onsubmit=async e=>{e.preventDefault();try{if(tsource.value===tdest.value)throw Error('حساب مبدا و مقصد باید متفاوت باشند.');const r=await api('/api/transactions/transfer/',{method:'POST',body:JSON.stringify({source_account_id:Number(tsource.value),destination_account_id:Number(tdest.value),amount:num(tamount.value),date:jalaliToGreg(tdate.value),description:tdesc.value.trim()})});closeModal();await txPage();if(r?.impact)alert('انتقال ثبت شد و درآمد/هزینه ماهانه تغییر نکرد.')}catch(x){transfererr.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}

async function loansPage(){document.body.innerHTML=shell('loans',`<div class="top"><div><h1>وام و اقساط</h1><p>مدیریت وام‌ها و پرداخت واقعی اقساط.</p></div><button class="btn primary" onclick="openLoan()">＋ ثبت وام</button></div><div id="loansout" class="loading">در حال دریافت...</div>`);try{const z=await Promise.all([api('/api/loans/'),api('/api/installments/')]);S.loans=list(z[0]);S.inst=list(z[1]);drawLoans()}catch(e){loansout.innerHTML='<div class="card error">'+e.message+'</div>'}}

function openLoan(id){const l=id?S.loans.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>${l?'ویرایش وام':'ثبت وام'}</h2><button class="btn" onclick="closeModal()">×</button></div><form id="loanform"><div class="field"><label>عنوان</label><input id="ltitle" required value="${esc(l?.title||'')}"></div><div class="field"><label>نوع</label><select id="ltype"><option value="LOAN">وام</option><option value="DEBT">بدهی</option></select></div><div class="field"><label>مبلغ وام <span class="unit">تومان</span></label><input id="lprincipal" inputmode="numeric" required value="${l?.principal_amount?money(l.principal_amount):''}"></div><div class="field"><label>مبلغ سود <span class="unit">تومان</span></label><input id="linterest" inputmode="numeric" value="${l?.interest_amount?money(l.interest_amount):''}"></div><div class="field"><label>اصل وام <span class="unit">مبلغ وام + سود — محاسبه خودکار</span></label><input id="lprincipalTotal" inputmode="numeric" readonly tabindex="-1" value=""></div><div class="formgrid"><div class="field"><label>مبلغ هر قسط <span class="unit">اختیاری</span></label><input id="linstall" inputmode="numeric" value="${l?.installment_amount?money(l.installment_amount):''}"></div><div class="field"><label>تعداد اقساط <span class="unit">اختیاری</span></label><input id="lcount" type="number" inputmode="numeric" min="1" step="1" value="${l?.total_installments||''}"></div></div><div id="loanCalc" class="notice" style="display:none"></div><div class="field date-field"><label>تاریخ شروع</label><input id="lstart" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۰۱" required></div><div class="field" id="historyField" style="display:none"><label>وضعیت اقساط گذشته</label><select id="lhistory"><option value="ALL_PAID">همه اقساط گذشته پرداخت شده</option><option value="OVERDUE_COUNT">تعدادی از اقساط گذشته عقب‌افتاده است</option></select></div><div class="field" id="overdueField" style="display:none"><label>تعداد اقساط عقب‌افتاده</label><input id="loverdue" type="number" inputmode="numeric" min="0" step="1" value="0"></div><div id="loanerr"></div><button class="btn primary" style="width:100%">ذخیره</button></form></section></div>`);ltype.value=l?.loan_type||'LOAN';setJalaliField('lstart',l?.start_date||todayLocal());lprincipal.addEventListener('input',()=>{formatAmountInput(lprincipal);syncLoanCalc('principal')});linterest.addEventListener('input',()=>{formatAmountInput(linterest);syncLoanCalc('interest')});linstall.addEventListener('input',()=>{formatAmountInput(linstall);syncLoanCalc('installment')});lcount.addEventListener('input',()=>{lcount.value=normalizeDigits(lcount.value).replace(/\D/g,'');syncLoanCalc('count')});loverdue.addEventListener('input',()=>{loverdue.value=normalizeDigits(loverdue.value).replace(/\D/g,'')});function syncLoanCalc(changed){const p=num(lprincipal.value),i=num(linterest.value),repayment=p+i;const hasI=linterest.value.trim()!=='',hasInst=linstall.value.trim()!=='',hasN=lcount.value.trim()!=='';lprincipalTotal.value=p>0?money(repayment):'';if(p>0&&hasI){if(changed==='count'&&hasN){const n=Number(lcount.value)||0;if(n>0){linstall.value=money(Math.ceil(repayment/n))}}else if(changed==='installment'&&hasInst){const inst=num(linstall.value);if(inst>0){lcount.value=String(Math.ceil(repayment/inst))}}else if(hasN){const n=Number(lcount.value)||0;if(n>0)linstall.value=money(Math.ceil(repayment/n))}else if(hasInst){const inst=num(linstall.value);if(inst>0)lcount.value=String(Math.ceil(repayment/inst))}}const finalI=num(linterest.value),finalInst=num(linstall.value),finalN=Number(lcount.value)||0;lprincipalTotal.value=p>0?money(p+Math.max(finalI,0)):'';if(p>0&&(finalI>0||finalInst>0||finalN>0)){loanCalc.style.display='block';loanCalc.innerHTML='<b>محاسبه خودکار</b><div style="margin-top:6px">مبلغ وام: '+money(p)+' تومان · سود: '+money(finalI)+' تومان · اصل وام: '+money(p+Math.max(finalI,0))+' تومان</div><div style="margin-top:4px">قسط: '+money(finalInst)+' تومان · تعداد: '+fa(finalN)+'</div>'}else{loanCalc.style.display='none';loanCalc.innerHTML=''}}const syncHistory=()=>{const oldDate=jalaliToGreg(lstart.value),isOld=oldDate<todayLocal();historyField.style.display=(!l&&isOld)?'block':'none';overdueField.style.display=(!l&&isOld&&lhistory.value==='OVERDUE_COUNT')?'block':'none'};lhistory.onchange=syncHistory;lstart.addEventListener('change',syncHistory);syncHistory();syncLoanCalc();loanform.onsubmit=async e=>{e.preventDefault();const p=num(lprincipal.value),i=num(linterest.value),inst=num(linstall.value),n=Number(lcount.value)||0,supplied=[linterest.value.trim()!=='',linstall.value.trim()!=='',lcount.value.trim()!==''].filter(Boolean).length;const body={title:ltitle.value.trim(),loan_type:ltype.value,principal_amount:p,interest_amount:i,installment_amount:inst,total_installments:n,start_date:jalaliToGreg(lstart.value),is_active:true};try{if(!body.title||p<=0)throw Error('عنوان و مبلغ وام را وارد کنید.');if(supplied<2)throw Error('حداقل دو مورد از سود کل، مبلغ قسط و تعداد اقساط را وارد کنید.');if(linterest.value.trim()&&i<0)throw Error('سود کل وام نمی‌تواند منفی باشد.');if(linstall.value.trim()&&inst<=0)throw Error('مبلغ قسط باید بزرگ‌تر از صفر باشد.');if(lcount.value.trim()&&n<1)throw Error('تعداد اقساط باید حداقل ۱ باشد.');if(l){delete body.interest_amount;delete body.installment_amount;delete body.total_installments;delete body.principal_amount;await api('/api/loans/'+l.id+'/',{method:'PATCH',body:JSON.stringify(body)})}else{const oldDate=body.start_date<todayLocal();if(oldDate){body.history_mode=lhistory.value;if(lhistory.value==='OVERDUE_COUNT'){const overdue=Number(loverdue.value)||0;if(overdue>n)throw Error('تعداد اقساط عقب‌افتاده نمی‌تواند بیشتر از کل اقساط باشد.');body.overdue_count=overdue}}await api('/api/loans/',{method:'POST',body:JSON.stringify(body)})}closeModal();await loansPage()}catch(x){loanerr.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}

async function payInst(id){const i=S.inst.find(x=>x.id===id);const remaining=num(i.amount)-num(i.paid_amount);const accountOptions=S.accs.filter(x=>x.is_active).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');const cats=S.cats.filter(x=>x.is_active&&x.category_type==='EXPENSE').map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>پرداخت قسط ${fa(i.installment_number)}</h2><button class="btn" onclick="closeModal()">×</button></div><form id="payform"><div class="field"><label>مبلغ پرداخت</label><input id="pamt" inputmode="numeric" value="${money(remaining)}"></div><div class="field"><label>حساب</label><select id="pacc">${accountOptions}</select></div><div class="field"><label>دسته هزینه</label><select id="pcat"><option value="">بدون دسته</option>${cats}</select></div><div class="field date-field"><label>تاریخ پرداخت</label><input id="pdate" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۰۱" required></div><div id="payerr"></div><button class="btn primary" style="width:100%">ثبت پرداخت</button></form></section></div>`);setJalaliField('pdate',todayLocal());pamt.addEventListener('input',()=>formatAmountInput(pamt));payform.onsubmit=async e=>{e.preventDefault();try{const body={amount:num(pamt.value),account_id:Number(pacc.value),category_id:pcat.value?Number(pcat.value):null,paid_date:jalaliToGreg(pdate.value)};await api('/api/installments/'+id+'/pay/',{method:'POST',body:JSON.stringify(body)});closeModal();await loansPage()}catch(x){payerr.innerHTML='<div class="error">'+x.message+'</div>'}}}
async function accountsPage(){document.body.innerHTML=shell('accounts',`<div class="top"><div><h1>حساب‌ها</h1><p>حساب‌های واقعی متصل به کاربر.</p></div><button class="btn primary" onclick="openAccount()">＋ حساب جدید</button></div><div id="accountsout" class="loading">در حال دریافت...</div>`);try{const z=await Promise.all([api('/api/accounts/'),api('/api/transactions/'),api('/api/dashboard/')]);S.accs=list(z[0]);const txs=list(z[1]);const dash=z[2];accountsout.innerHTML='<section class="card"><div class="row"><span>موجودی کل فعال</span><b>'+money(dash.current_balance)+' تومان</b></div>'+S.accs.map(a=>{const today=todayLocal();const balance=num(a.initial_balance)+txs.filter(t=>String(t.account)===String(a.id)&&t.is_confirmed&&String(t.date||'')<=today).reduce((s,t)=>s+(typeIs(t,'INCOME')?num(t.amount):typeIs(t,'EXPENSE')?-num(t.amount):(t.transaction_type==='TRANSFER'?(t.transfer_direction==='IN'?num(t.amount):-num(t.amount)):0)),0);return '<div class="row"><div><b>'+esc(a.name)+'</b><div class="muted">'+a.account_type+' · '+(a.is_active?'فعال':'غیرفعال')+'</div></div><div><b>'+money(balance)+' تومان</b><div class="mini">موجودی فعلی</div><button class="btn" onclick="openAccount('+a.id+')">ویرایش</button></div></div>'}).join('')+'</section>'}catch(e){accountsout.innerHTML='<div class="card error">'+e.message+'</div>'}}
function openAccount(id){const a=id?S.accs.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>${a?'ویرایش حساب':'حساب جدید'}</h2><button class="btn" onclick="closeModal()">×</button></div><form id="accform"><div class="field"><label>نام</label><input id="aname" required value="${esc(a?.name||'')}"></div><div class="field"><label>نوع</label><select id="atype"><option value="BANK">بانک</option><option value="CASH">نقدی</option><option value="WALLET">کیف پول</option><option value="OTHER">سایر</option></select></div><div class="field"><label>موجودی اولیه</label><input id="ainit" inputmode="numeric" value="${a?.initial_balance||0}"></div><div class="field"><label><input id="aactive" type="checkbox" ${a?.is_active!==false?'checked':''}> فعال</label></div><div id="accerr"></div><button class="btn primary" style="width:100%">ذخیره</button></form></section></div>`);atype.value=a?.account_type||'BANK';ainit.addEventListener('input',()=>formatAmountInput(ainit));accform.onsubmit=async e=>{e.preventDefault();try{const body={name:aname.value.trim(),account_type:atype.value,initial_balance:num(ainit.value),is_active:aactive.checked};await api(a?'/api/accounts/'+a.id+'/':'/api/accounts/',{method:a?'PATCH':'POST',body:JSON.stringify(body)});closeModal();await ensureData();await accountsPage()}catch(x){accerr.innerHTML='<div class="error">'+x.message+'</div>'}}}
async function categoriesPage(){document.body.innerHTML=shell('categories',`<div class="top"><div><h1>دسته‌بندی‌ها</h1><p>دسته‌بندی‌های درآمد و هزینه.</p></div><button class="btn primary" onclick="openCategory()">＋ دسته جدید</button></div><div id="catsout" class="loading">در حال دریافت...</div>`);try{S.cats=list(await api('/api/categories/'));catsout.innerHTML='<section class="card">'+S.cats.map(c=>'<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">'+(c.category_type==='INCOME'?'درآمد':'هزینه')+' · '+(c.is_active?'فعال':'غیرفعال')+'</div></div><button class="btn" onclick="openCategory('+c.id+')">ویرایش</button></div>').join('')+'</section>'}catch(e){catsout.innerHTML='<div class="card error">'+e.message+'</div>'}}
function openCategory(id){const c=id?S.cats.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><section class="modal"><div class="top"><h2>${c?'ویرایش دسته':'دسته جدید'}</h2><button class="btn" onclick="closeModal()">×</button></div><form id="catform"><div class="field"><label>نام</label><input id="cname" required value="${esc(c?.name||'')}"></div><div class="field"><label>نوع</label><select id="ctype"><option value="EXPENSE">هزینه</option><option value="INCOME">درآمد</option></select></div><div class="field"><label>آیکون</label><input id="cicon" value="${esc(c?.icon||'')}"></div><div class="field"><label><input id="cactive" type="checkbox" ${c?.is_active!==false?'checked':''}> فعال</label></div><div id="caterr"></div><button class="btn primary" style="width:100%">ذخیره</button></form></section></div>`);ctype.value=c?.category_type||'EXPENSE';catform.onsubmit=async e=>{e.preventDefault();try{const body={name:cname.value.trim(),category_type:ctype.value,icon:cicon.value.trim(),is_active:cactive.checked};await api(c?'/api/categories/'+c.id+'/':'/api/categories/',{method:c?'PATCH':'POST',body:JSON.stringify(body)});closeModal();S.cats=list(await api('/api/categories/'));await categoriesPage()}catch(x){caterr.innerHTML='<div class="error">'+x.message+'</div>'}}}
async function assistantPage(){document.body.innerHTML=shell('assistant',`<div class="top"><div><h1>دستیار مالی</h1><p>فعلاً آماده اتصال به endpoint تحلیل است.</p></div></div><section class="card"><div class="notice">داده‌های مالی از Django می‌آیند و محاسبات اصلی توسط Financial Engine انجام می‌شود. پاسخ‌های هوشمند نباید جایگزین محاسبات قطعی مالی شوند.</div><form id="chatform" style="margin-top:15px"><div class="field"><label>سؤال مالی</label><textarea id="question" rows="4" placeholder="مثلاً این ماه چقدر می‌توانم خرج کنم؟"></textarea></div><button class="btn primary">تحلیل</button></form><div id="chatout"></div></section>`);chatform.onsubmit=async e=>{e.preventDefault();chatout.innerHTML='<div class="loading">در حال تحلیل...</div>';try{const r=await api('/api/assistant/chat/',{method:'POST',body:JSON.stringify({message:question.value})});chatout.innerHTML='<div class="card" style="margin-top:14px"><b>پاسخ</b><p>'+esc(r.answer||r.response||JSON.stringify(r))+'</p></div>'}catch(x){chatout.innerHTML='<div class="error">'+x.message+'</div>'}}}
const jalaliMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jalaliWeek=['ش','ی','د','س','چ','پ','ج'];
const jalaliParts=iso=>{const a=(iso||todayLocal()).split('-').map(Number);const p=Object.fromEntries(persianDateFmt.formatToParts(new Date(Date.UTC(a[0],a[1]-1,a[2],12))).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));return {y:p.year,m:p.month,d:p.day}};
const jalaliDaysInMonth=(y,m)=>{for(let d=m===12?30:(m<=6?31:30);d>=1;d--){try{jalaliToGreg(fa(y)+'/'+fa(m)+'/'+fa(d));return d}catch(e){}}return 29};
let jpState=null;
function openJalaliPicker(id){const el=document.getElementById(id);if(!el)return;let p=jalaliParts(el.value?jalaliToGreg(el.value):todayLocal());jpState={id,y:p.y,m:p.m};renderJalaliPicker()}
function moveJalaliMonth(delta){if(!jpState)return;jpState.m+=delta;if(jpState.m<1){jpState.m=12;jpState.y--}if(jpState.m>12){jpState.m=1;jpState.y++}renderJalaliPicker()}
function renderJalaliPicker(){if(!jpState)return;document.getElementById('jalaliPicker')?.remove();const first=jalaliToGreg(fa(jpState.y)+'/'+fa(jpState.m)+'/1');const wd=(new Date(first+'T12:00:00Z').getUTCDay()+1)%7;const days=jalaliDaysInMonth(jpState.y,jpState.m);const el=document.getElementById(jpState.id);const selected=el?.value?(()=>{try{return jalaliParts(jalaliToGreg(el.value))}catch(e){return null}})():null;let cells='';for(let i=0;i<wd;i++)cells+='<button type="button" class="empty">.</button>';for(let d=1;d<=days;d++){const sel=selected&&selected.y===jpState.y&&selected.m===jpState.m&&selected.d===d?' selected':'';cells+='<button type="button" class="'+sel+'" onclick="pickJalaliDay('+d+')">'+fa(d)+'</button>'}document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="jalaliPicker"><section class="modal jalali-picker"><div class="jp-head"><button type="button" onclick="moveJalaliMonth(-1)">‹</button><button type="button" class="jp-title" style="border:0;background:none;padding:8px;border-radius:9px;font-weight:bold" onclick="openJalaliYM()">'+fa(jpState.y)+' · '+jalaliMonths[jpState.m-1]+'</button><button type="button" onclick="moveJalaliMonth(1)">›</button></div><div class="jp-week">'+jalaliWeek.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="jp-days">'+cells+'</div><button type="button" class="btn" style="width:100%;margin-top:12px" onclick="document.getElementById(\'jalaliPicker\')?.remove()">بستن</button></section></div>')}
function openJalaliYM(){if(!jpState)return;document.getElementById('jalaliYM')?.remove();const years=[];for(let y=1390;y<=1450;y++)years.push('<option value="'+y+'" '+(y===jpState.y?'selected':'')+'>'+fa(y)+'</option>');document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="jalaliYM"><section class="modal" style="width:min(420px,100%)"><div class="top"><h2>انتخاب سال و ماه</h2><button class="btn" onclick="document.getElementById(\'jalaliYM\')?.remove()">×</button></div><div class="field"><label>سال</label><select id="jpYear">'+years.join('')+'</select></div><div class="field"><label>ماه</label><select id="jpMonth">'+jalaliMonths.map((m,i)=>'<option value="'+(i+1)+'" '+(i+1===jpState.m?'selected':'')+'>'+m+'</option>').join('')+'</select></div><button type="button" class="btn primary" style="width:100%" onclick="applyJalaliYM()">انتخاب</button></section></div>')}function applyJalaliYM(){if(!jpState)return;jpState.y=Number(document.getElementById('jpYear').value);jpState.m=Number(document.getElementById('jpMonth').value);document.getElementById('jalaliYM')?.remove();renderJalaliPicker()}function pickJalaliDay(d){const el=document.getElementById(jpState.id);if(el){el.value=fa(jpState.y+'/'+String(jpState.m).padStart(2,'0')+'/'+String(d).padStart(2,'0'));el.dispatchEvent(new Event('change',{bubbles:true}))}document.getElementById('jalaliPicker')?.remove();jpState=null}
document.addEventListener('click',e=>{const el=e.target.closest?.('input');if(el&&['fdate','tdate','lstart','pdate'].includes(el.id)){e.preventDefault();openJalaliPicker(el.id)}});
async function route(){const p=location.hash.slice(1)||'home';if(!token()&&p!=='auth')return auth();if(p==='auth')return auth();if(p==='tx')return txPage();if(p==='loans')return loansPage();if(p==='accounts')return accountsPage();if(p==='categories')return categoriesPage();if(p==='assistant')return assistantPage();return home()}
addEventListener('hashchange',route);if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=5',{updateViaCache:'none'}).catch(()=>{})}route();
</script>
</body></html>
