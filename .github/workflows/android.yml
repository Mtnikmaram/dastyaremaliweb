name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Android UI fixes
        working-directory: .
        run: |
          python3 android/patch_ui.py
          if git diff --quiet; then
            echo "UI patch already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/java/ir/dastyaremali/app/MainActivity.kt
            git commit -m "Fix Android transaction flow and date picker"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-financial-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
